<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakina - Chekni Skanerlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    h2 {
      margin-top: 10px;
      color: #1e293b;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }
    #reader {
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      background: white;
    }
    #status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      max-width: 360px;
      line-height: 1.4;
      white-space: pre-line;
    }
    .success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .loading {
      background-color: #e0f2fe;
      color: #075985;
      border: 1px solid #7dd3fc;
    }
  </style>
</head>
<body>

  <h2>Kassa chekini skanerlang</h2>
  <p>Fiskal chekdagi QR-kodni kameraga to‘g‘rilang</p>

  <div id="reader"></div>
  <div id="status"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCYYey91UfsPfueoCxgXFhCnm5qa9AQO7uKovrgS02lbLYMIFQ9uQYcJi3q3gpfGrF_g/exec";

    let isScanning = true;

    function showStatus(text, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.className = type;
      statusDiv.innerText = text;
    }

    // Fiskal chekni, summasini va sanasini xatosiz tahlil qilish
    function parseFiscalCheck(text) {
      if (!text || typeof text !== "string") return null;

      const hasSoliqParam = text.includes("ofd.soliq.uz")  text.includes("soliq.uz")  text.includes("s=");
      if (!hasSoliqParam) return null;

      let amount = null;
      let isExpired = false;

      try {
        const cleanUrl = text.startsWith("http") ? text : "https://" + text;
        const parsedUrl = new URL(cleanUrl);
        const params = parsedUrl.searchParams;

        // 1. Summani qat'iy 's' parametridan ajratib olamiz
        const sParam = params.get("s");
        if (sParam) {
          amount = parseFloat(sParam);
          // Agar kassa summani tiyinlarda chiqargan bo'lsa (masalan 2000000 tiyin = 20 000 so'm)
          if (amount >= 1000000) {
            amount = amount / 100;
          }
        }

        // 2. Vaqtni tekshirish (time parametri orqali: YYYYMMDD...)
        const timeParam = params.get("time") || params.get("t");
        if (timeParam && timeParam.length >= 8) {
          const checkDateStr = timeParam.substring(0, 8); // YYYYMMDD
          
          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const day = String(now.getDate()).padStart(2, '0');
          const todayStr = ${year}${month}${day};

          if (checkDateStr !== todayStr) {
            isExpired = true;
          }
        }
      } catch (err) {
        // Zaxira: aniq s= parametri uchun regex
        const matchAmount = text.match(/[?&]s=([0-9]+)/);
        if (matchAmount && matchAmount[1]) {
          amount = parseFloat(matchAmount[1]);
          if (amount >= 1000000) amount = amount / 100;
        }
      }

      return {
        amount: amount,
        isExpired: isExpired
      };
    }

    function onScanSuccess(decodedText) {
      if (!isScanning) return;

      const checkData = parseFiscalCheck(decodedText);

      // 1. Agar haqiqiy fiskal chek bo'lmasa yoki summa aniqlanmasa
      if (!checkData  checkData.amount === null  isNaN(checkData.amount)) {
        showStatus("❌ Bu haqiqiy kassa cheki emas!\nIltimos, rasmiy kassa chekini skanerlang.", "error");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return;
      }

      // 2. Chek eskirgan bo'lsa (bugungi xarid bo'lmasa)
      if (checkData.isExpired) {
        showStatus("❌ Chekning amal qilish muddati o‘tgan!\nAksiyada faqat bugun xarid qilingan cheklar qabul qilinadi.", "error");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return;
      }

      // 3. Xarid summasi 60 000 dan kam bo'lsa
      if (checkData.amount < 60000) {
        showStatus("❌ Xarid summasi yetarli emas!\nAksiyada faqat 60 000 so'mdan yuqori cheklar qabul qilinadi.\nSizning xaridingiz: " + checkData.amount.toLocaleString() + " so'm", "error");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return;
      }

      // Barcha shartlar to'liq bajarilsa: kamerani to'xtatamiz va yuboramiz
      isScanning = false;
      html5QrCode.stop().then(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const telegramUser = tg.initDataUnsafe?.user;

        const currentUserId = urlParams.get('tg_id') || (telegramUser?.id ? String(telegramUser.id) : "test_user_123");
        const currentUserName = urlParams.get('name') || (telegramUser?.first_name ? telegramUser.first_name : "Mijoz");

        showStatus("✅ Chek qabul qilindi!\nXarid summasi: " + checkData.amount.toLocaleString() + " so'm", "success");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            user_id: currentUserId,
            user_name: currentUserName,
            qr_code: decodedText,
            amount: checkData.amount
          })
        });

        setTimeout(() => {
          tg.close();
        }, 300);
      });
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      showStatus("Kamerani yoqib bo‘lmadi: " + err, "error");
    });
  </script>
</body>
</html>
