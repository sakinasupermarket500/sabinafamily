<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakina - Chekni Skanerlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 22px;
    }
    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-scan {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-scan:active {
      transform: scale(0.98);
      background-color: #0369a1;
    }
    #status {
      margin-top: 24px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      max-width: 340px;
      line-height: 1.5;
      white-space: pre-line;
      text-align: center;
    }
    .success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>

  <h2>Kassa chekini skanerlang</h2>
  <p>Fiskal chekdagi QR-kodni to‘g‘rilash uchun quyidagi tugmani bosing</p>

  <button class="btn-scan" onclick="startScanner()">
    📷 Kamerani ochish
  </button>

  <div id="status"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCYYey91UfsPfueoCxgXFhCnm5qa9AQO7uKovrgS02lbLYMIFQ9uQYcJi3q3gpfGrF_g/exec";

    // Sakina STIR (agar ma'lum bo'lsa kiriting, aks holda tekshiruv o'tadi)
    const SAKINA_STIR = "SAKINA_STIR_RAQAMI";

    function showStatus(text, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.className = type;
      statusDiv.innerText = text;
    }

    function parseFiscalCheck(text) {
      if (!text || typeof text !== "string") return null;

      const hasSoliqParam = text.includes("ofd.soliq.uz")  text.includes("soliq.uz")  text.includes("s=");
      if (!hasSoliqParam) return null;

      let amount = null;
      let isExpired = false;
      let isOurStore = true;

      try {
        const cleanUrl = text.startsWith("http") ? text : "https://" + text;
        const parsedUrl = new URL(cleanUrl);
        const params = parsedUrl.searchParams;

        // 1. STIR tekshiruvi
        if (SAKINA_STIR !== "SAKINA_STIR_RAQAMI") {
          const checkTin = params.get("c")  params.get("tin")  "";
          if (!text.includes(SAKINA_STIR) && checkTin !== SAKINA_STIR) {
            isOurStore = false;
          }
        }

        // 2. Summani 's' parametridan olish
        const sParam = params.get("s");
        if (sParam) {
          amount = parseFloat(sParam);
          if (amount >= 1000000) {
            amount = amount / 100;
          }
        }

        // 3. Vaqtni tekshirish
        const timeParam = params.get("time") || params.get("t");
        if (timeParam && timeParam.length >= 8) {
          const checkDateStr = timeParam.substring(0, 8);
          
          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const day = String(now.getDate()).padStart(2, '0');
          const todayStr = ${year}${month}${day};

          if (checkDateStr !== todayStr) {
            isExpired = true;
          }
        }
      } catch (err) {
        const matchAmount = text.match(/[?&]s=([0-9]+)/);
        if (matchAmount && matchAmount[1]) {
          amount = parseFloat(matchAmount[1]);
          if (amount >= 1000000) amount = amount / 100;
        }
      }

      return {
        amount: amount,
        isExpired: isExpired,
        isOurStore: isOurStore
      };
    }

    function handleDecodedText(decodedText) {
      const checkData = parseFiscalCheck(decodedText);

      if (!checkData  checkData.amount === null  isNaN(checkData.amount)) {
        showStatus("❌ Bu haqiqiy kassa cheki emas!\nIltimos, rasmiy kassa chekini skanerlang.", "error");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return false;
      }

      if (!checkData.isOurStore) {
        showStatus("❌ Bu «Sakina» supermarketining cheki emas!\nAksiyada faqat bizning do‘kon cheklari qabul qilinadi.", "error");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return false;
      }

      if (checkData.isExpired) {
        showStatus("❌ Chekning amal qilish muddati o‘tgan!\nAksiyada faqat bugun xarid qilingan cheklar qabul qilinadi.", "error");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return false;
      }

      if (checkData.amount < 60000) {
        showStatus("❌ Xarid summasi yetarli emas!\nAksiyada faqat 60 000 so'mdan yuqori cheklar qabul qilinadi.\nSizning xaridingiz: " + checkData.amount.toLocaleString() + " so'm", "error");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return false;
      }

      // To'g'ri bo'lsa
      showStatus("✅ Chek qabul qilindi!\nXarid summasi: " + checkData.amount.toLocaleString() + " so'm", "success");
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

      const urlParams = new URLSearchParams(window.location.search);
      const telegramUser = tg.initDataUnsafe?.user;
      const currentUserId = urlParams.get('tg_id') || (telegramUser?.id ? String(telegramUser.id) : "test_user_123");
      const currentUserName = urlParams.get('name') || (telegramUser?.first_name ? telegramUser.first_name : "Mijoz");

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          user_id: currentUserId,
          user_name: currentUserName,
          qr_code: decodedText,
          amount: checkData.amount
        })
      });

      setTimeout(() => {
        tg.close();
      }, 500);

      return true; // Telegram QR popupini yopish uchun
    }

    function startScanner() {
      // Telegramning o'zining tezkor mahalliy QR skanerini ochish
      if (tg.showScanQrPopup) {
        tg.showScanQrPopup({
          text: "Chekdagi QR kodni to'g'rilang"
        }, function(text) {
          const isDone = handleDecodedText(text);
          return isDone; // true qaytarsa o'z-o'zidan kamerani yopadi
        });
      } else {
        alert("Telegram ilovangizni yangilang, skaner funksiyasi qo'llab-quvvatlanmadi.");
      }
    }

    // Sahifa ochilishi bilan kamerani avtomatik ochishga urinish
    window.onload = function() {
      setTimeout(() => {
        startScanner();
      }, 300);
    };
  </script>
</body>
</html>
