<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sakina - Chekni Skanerlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px; background-color: #0f172a; color: white;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; text-align: center;
    }
    h2 { margin: 8px 0 4px; font-size: 20px; }
    p { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
    .camera-box {
      position: relative; width: 100%; max-width: 320px; height: 320px;
      border-radius: 20px; overflow: hidden; border: 3px solid #38bdf8;
      background: #000; display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { display: none; }
    .scanner-laser {
      position: absolute; width: 90%; height: 2px; background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8; animation: scan 2s infinite ease-in-out;
    }
    @keyframes scan { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
    #status {
      margin-top: 16px; padding: 12px 16px; border-radius: 12px;
      font-size: 14px; max-width: 320px; line-height: 1.4;
      display: none; white-space: pre-line;
    }
    .error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
    .success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #86efac; }
  </style>
</head>
<body>

  <h2>Kassa chekini skanerlang</h2>
  <p>QR-kodni to‘rtburchak ichiga to‘g‘rilang</p>

  <div class="camera-box">
    <video id="video" playsinline autoplay muted></video>
    <div class="scanner-laser"></div>
  </div>

  <canvas id="canvas"></canvas>
  <div id="status"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCYYey91UfsPfueoCxgXFhCnm5qa9AQO7uKovrgS02lbLYMIFQ9uQYcJi3q3gpfGrF_g/exec";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusDiv = document.getElementById('status');
    let isScanning = true;

    function showStatus(text, type) {
      statusDiv.style.display = 'block';
      statusDiv.className = type;
      statusDiv.innerText = text;
    }

    function parseFiscalCheck(text) {
      if (!text || typeof text !== "string") return { isValid: false, error: "not_fiscal" };

      if (!text.includes("ofd.soliq.uz") && !text.includes("soliq.uz")) {
        return { isValid: false, error: "not_fiscal" };
      }

      try {
        const cleanUrl = text.startsWith("http") ? text : "https://" + text;
        const parsedUrl = new URL(cleanUrl);
        const params = parsedUrl.searchParams;

        // Sana Soliq QR-kodida aynan 'c' parametrida keladi: c=20261024183346
        const cParam = params.get("c");
        if (cParam && cParam.length >= 8) {
          const checkDate = cParam.substring(0, 8); // YYYYMMDD
          const now = new Date();
          const yyyy = String(now.getFullYear());
          const mm = String(now.getMonth() + 1).padStart(2, '0');
          const dd = String(now.getDate()).padStart(2, '0');
          const today = `${yyyy}${mm}${dd}`;

          if (checkDate !== today) {
            return { isValid: false, error: "expired" };
          }
        }
        return { isValid: true };
      } catch (e) {
        return { isValid: false, error: "not_fiscal" };
      }
    }

    function tick() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert"
        });

        if (code && code.data) {
          const check = parseFiscalCheck(code.data);

          if (!check.isValid && check.error === "not_fiscal") {
            showStatus("❌ Bu haqiqiy kassa cheki emas!\nIltimos, rasmiy kassa chekini skanerlang.", "error");
            isScanning = false;
            setTimeout(() => { statusDiv.style.display = 'none'; isScanning = true; requestAnimationFrame(tick); }, 3000);
          } else if (!check.isValid && check.error === "expired") {
            showStatus("❌ Chekning amal qilish muddati o‘tgan!\nAksiyada faqat bugun xarid qilingan cheklar qabul qilinadi.", "error");
            isScanning = false;
            setTimeout(() => { statusDiv.style.display = 'none'; isScanning = true; requestAnimationFrame(tick); }, 3000);
          } else {
            // Muvaffaqiyatli o'qildi
            isScanning = false;
            showStatus("✅ Chek qabul qilindi!\nMa'lumotlar saqlanmoqda...", "success");
            
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

            const urlParams = new URLSearchParams(window.location.search);
            const currentUserId = urlParams.get('tg_id') || (tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "user");
            const currentUserName = urlParams.get('name') || (tg?.initDataUnsafe?.user?.first_name ? tg.initDataUnsafe.user.first_name : "Mijoz");

            fetch(APPS_SCRIPT_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({
                user_id: currentUserId,
                user_name: currentUserName,
                qr_code: code.data
              })
            });

            setTimeout(() => {
              if (tg) tg.close();
            }, 1500);
            return;
          }
        }
      }
      requestAnimationFrame(tick);
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    }).then(function(stream) {
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.play();
      requestAnimationFrame(tick);
    }).catch(function(err) {
      showStatus("❌ Kamerani yoqib bo‘lmadi.\nSozlamalardan kameraga ruxsat bering.", "error");
    });
  </script>
</body>
</html>
