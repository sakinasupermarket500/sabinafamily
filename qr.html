<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sakina - Chekni Skanerlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    h2 { margin: 8px 0 4px; font-size: 20px; }
    p { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
    
    .camera-box {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 320px;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid #38bdf8;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas { display: none; }
    
    .scanner-laser {
      position: absolute;
      width: 90%;
      height: 2px;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: scan 2s infinite ease-in-out;
    }
    @keyframes scan {
      0% { top: 10%; }
      50% { top: 90%; }
      100% { top: 10%; }
    }

    #status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      max-width: 320px;
      line-height: 1.4;
      display: none;
      white-space: pre-line;
    }
    .error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
    .success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #86efac; }
  </style>
</head>
<body>

  <h2>Kassa chekini skanerlang</h2>
  <p>QR-kodni to‘rtburchak ichiga to‘g‘rilang</p>

  <div class="camera-box">
    <video id="video" playsinline autoplay muted></video>
    <div class="scanner-laser"></div>
  </div>

  <canvas id="canvas"></canvas>
  <div id="status"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCYYey91UfsPfueoCxgXFhCnm5qa9AQO7uKovrgS02lbLYMIFQ9uQYcJi3q3gpfGrF_g/exec";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusDiv = document.getElementById('status');
    
    let isScanning = true;

    function showStatus(text, type) {
      statusDiv.style.display = 'block';
      statusDiv.className = type;
      statusDiv.innerText = text;
    }

    function parseFiscalCheck(text) {
      if (!text || typeof text !== "string") return null;

      // Soliq fiskal cheki havolasi ekanligini tasdiqlash
      const isFiscal = text.includes("soliq.uz") || text.includes("s=") || text.includes("ofd");
      if (!isFiscal) return null;

      let amount = null;

      try {
        const cleanUrl = text.startsWith("http") ? text : "https://" + text;
        const parsedUrl = new URL(cleanUrl);
        const params = parsedUrl.searchParams;

        // Summani aniq 's' parametridan ajratib olish
        const sParam = params.get("s");
        if (sParam) {
          amount = parseFloat(sParam);
          if (amount >= 1000000) {
            amount = amount / 100;
          }
        }
      } catch (err) {
        const matchAmount = text.match(/[?&]s=([0-9]+)/);
        if (matchAmount && matchAmount[1]) {
          amount = parseFloat(matchAmount[1]);
          if (amount >= 1000000) amount = amount / 100;
        }
      }

      return { amount: amount };
    }

    function tick() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert"
        });

        if (code && code.data) {
          const checkData = parseFiscalCheck(code.data);

          // 1. Agar fiskal chek bo'lmasa yoki summa aniqlanmasa
          if (!checkData || checkData.amount === null || isNaN(checkData.amount)) {
            showStatus("❌ Bu haqiqiy kassa cheki emas!\nIltimos, rasmiy fiskal kassa chekini skanerlang.", "error");
          } 
          // 2. Agar summa 60 000 so'mdan kam bo'lsa
          else if (checkData.amount < 60000) {
            showStatus("❌ Xarid summasi 60 000 so‘mdan kam!\nSizning xaridingiz: " + checkData.amount.toLocaleString() + " so‘m", "error");
          } 
          // 3. Hammasi to'g'ri bo'lsa - darhol qabul qilish
          else {
            isScanning = false;
            showStatus("✅ Chek qabul qilindi!\nXarid summasi: " + checkData.amount.toLocaleString() + " so‘m", "success");
            
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

            const urlParams = new URLSearchParams(window.location.search);
            const currentUserId = urlParams.get('tg_id') || (tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "user");
            const currentUserName = urlParams.get('name') || (tg?.initDataUnsafe?.user?.first_name ? tg.initDataUnsafe.user.first_name : "Mijoz");

            fetch(APPS_SCRIPT_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({
                user_id: currentUserId,
                user_name: currentUserName,
                qr_code: code.data,
                amount: checkData.amount
              })
            });

            setTimeout(() => {
              if (tg) tg.close();
            }, 600);
            return;
          }
        }
      }
      requestAnimationFrame(tick);
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    }).then(function(stream) {
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.play();
      requestAnimationFrame(tick);
    }).catch(function(err) {
      showStatus("❌ Kamerani yoqib bo‘lmadi.\nSozlamalardan kameraga ruxsat bering.", "error");
    });
  </script>
</body>
</html>
