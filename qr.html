<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakina - Chekni Skanerlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Kamera orqali QR o'qish uchun yengil kutubxona -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    h2 {
      margin-top: 10px;
      color: #1e293b;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }
    #reader {
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      background: white;
    }
    #status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      max-width: 360px;
      line-height: 1.4;
    }
    .success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .loading {
      background-color: #e0f2fe;
      color: #075985;
      border: 1px solid #7dd3fc;
    }
  </style>
</head>
<body>

  <h2>Kassa chekini skanerlang</h2>
  <p>QR-kodni kameraga to‘g‘rilang</p>

  <div id="reader"></div>

  <div id="status"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // SIZNING APPS SCRIPT HAVOLANGIZ
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCYYey91UfsPfueoCxgXFhCnm5qa9AQO7uKovrgS02lbLYMIFQ9uQYcJi3q3gpfGrF_g/exec";

    const user = tg.initDataUnsafe?.user || {
      id: "test_user_123",
      first_name: "Sinovchi"
    };

    let isScanning = true;

    function showStatus(text, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.className = type;
      statusDiv.innerText = text;
    }

    // QR ichidan summani ajratish (agar Soliq cheki bo'lsa)
    function parseAmountFromQR(text) {
      try {
        const match = text.match(/[?&]s=([0-9.]+)/i);
        if (match && match[1]) {
          let val = parseFloat(match[1]);
          if (val > 1000000) {
            val = val / 100; // Tiyindan so'mga o'tkazish
          }
          return val;
        }
      } catch (e) {
        console.error("Summa xatoligi:", e);
      }
      return null;
    }

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;

      html5QrCode.stop().then(() => {
        let detectedAmount = parseAmountFromQR(decodedText);

        // Agar begona QR yoki oddiy test QR bo'lsa, sinov uchun 65000 qilib oladi
        if (!detectedAmount) {
          detectedAmount = 65000;
        }

        // 60 000 so'mdan kam bo'lsa darhol to'xtatish
        if (detectedAmount < 60000) {
          showStatus("❌ Xarid summasi yetarli emas!\nAksiyada faqat 60 000 so'mdan yuqori cheklar qabul qilinadi.\nSizning xaridingiz: " + detectedAmount.toLocaleString() + " so'm", "error");
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
          return;
        }

        showStatus("Chek tekshirilmoqda, kuting...", "loading");

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            user_id: user.id,
            user_name: user.first_name,
            qr_code: decodedText,
            amount: detectedAmount
          })
        })
        .then(() => {
          showStatus("✅ Chek muvaffaqiyatli qabul qilindi!\nXarid summasi: " + detectedAmount.toLocaleString() + " so'm", "success");
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        })
        .catch(err => {
          showStatus("Ulanishda xatolik yuz berdi: " + err, "error");
        });
      });
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      showStatus("Kamerani yoqib bo‘lmadi: " + err, "error");
    });
  </script>
</body>
</html>
