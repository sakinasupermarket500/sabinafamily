<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakina - Chekni Skanerlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    h2 {
      margin-top: 10px;
      color: #1e293b;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }
    #reader {
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      background: white;
    }
    #status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      max-width: 360px;
      line-height: 1.4;
      white-space: pre-line;
    }
    .success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .loading {
      background-color: #e0f2fe;
      color: #075985;
      border: 1px solid #7dd3fc;
    }
  </style>
</head>
<body>

  <h2>Kassa chekini skanerlang</h2>
  <p>Fiskal chekdagi QR-kodni kameraga to‘g‘rilang</p>

  <div id="reader"></div>
  <div id="status"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCYYey91UfsPfueoCxgXFhCnm5qa9AQO7uKovrgS02lbLYMIFQ9uQYcJi3q3gpfGrF_g/exec";

    let isScanning = true;

    function showStatus(text, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.className = type;
      statusDiv.innerText = text;
    }

    // Rasmiy fiskal chek ekanini tekshirish va summasini ajratish
    function parseFiscalCheck(text) {
      if (!text || typeof text !== "string") return null;

      // Soliq fiskal cheklarining asosiy belgilari (ofd.soliq.uz yoki s= summasi bo'lishi kerak)
      const hasSoliqParam = text.includes("s=") || text.includes("ofd.soliq.uz") || text.includes("soliq.uz");
      if (!hasSoliqParam) {
        return null; // Telegram havola yoki begona QR kodlar shu yerda to'xtatiladi
      }

      // Summani ajratib olish (s= parametrini qidiradi)
      const match = text.match(/[?&]s=([0-9.]+)/i);
      if (match && match[1]) {
        let val = parseFloat(match[1]);
        // Agar summa tiyinda ko'rsatilgan bo'lsa (1 mln dan katta bo'lsa), so'mga aylantiramiz
        if (val > 1000000) {
          val = val / 100;
        }
        return val;
      }

      return null;
    }

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;

      html5QrCode.stop().then(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const telegramUser = tg.initDataUnsafe?.user;

        const currentUserId = urlParams.get('tg_id') || (telegramUser?.id ? String(telegramUser.id) : "test_user_123");
        const currentUserName = urlParams.get('name') || (telegramUser?.first_name ? telegramUser.first_name : "Mijoz");

        // 1. Standart fiskal chek ekanini va summasini tekshiramiz
        const detectedAmount = parseFiscalCheck(decodedText);

        if (!detectedAmount) {
          showStatus("❌ Bu haqiqiy kassa cheki emas!\nIltimos, Davlat Soliq Qo'mitasining rasmiy fiskal chekini skanerlang.", "error");
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
          return;
        }

        // 2. Summa 60 000 dan kam bo'lsa
        if (detectedAmount < 60000) {
          showStatus("❌ Xarid summasi yetarli emas!\nAksiyada faqat 60 000 so'mdan yuqori cheklar qabul qilinadi.\nSizning xaridingiz: " + detectedAmount.toLocaleString() + " so'm", "error");
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
          return;
        }

        showStatus("✅ Chek qabul qilindi!\nXarid summasi: " + detectedAmount.toLocaleString() + " so'm", "success");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

        // 3. Ma'lumotni Google Apps Script ga uzatamiz
        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            user_id: currentUserId,
            user_name: currentUserName,
            qr_code: decodedText,
            amount: detectedAmount
          })
        });

        // 4. Foydalanuvchi tasdiqni ko'rishi bilan oynani zudlik bilan yopamiz
        setTimeout(() => {
          tg.close();
        }, 150);
      });
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      showStatus("Kamerani yoqib bo‘lmadi: " + err, "error");
    });
  </script>
</body>
</html>
